<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Participant area – Coding Provenance Workshop, First Edition</title>
<style>
  :root { --ink: #1e1915; --ink-2: #5b5048; --paper: #faf6f0; --rule: #cfbfac; --red: #b0241b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--paper); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 28rem; border-top: 3px solid var(--ink); padding-top: 1.5rem; }
  .eyebrow { margin: 0 0 0.5rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
  h1 { margin: 0 0 0.75rem; font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; }
  p { margin: 0 0 1.25rem; color: var(--ink-2); }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.875rem; font-weight: 600; }
  .field { display: flex; gap: 0.5rem; }
  input[type=password] { flex: 1; min-width: 0; height: 2.75rem; padding: 0 0.75rem; border: 1px solid var(--rule); border-radius: 2px; background: #fff; font: inherit; }
  input[type=password]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  button { height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: 2px; background: var(--ink); color: var(--paper); font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: 0.6; cursor: wait; }
  .message { min-height: 1.5rem; margin: 0.6rem 0 0.4rem; color: var(--red); font-size: 0.9375rem; }
  .remember { display: flex; gap: 0.5rem; align-items: center; font-weight: 400; color: var(--ink-2); }
  .home { display: inline-block; margin-top: 2rem; color: var(--ink-2); font-size: 0.9375rem; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Coding Provenance Workshop · First Edition</p>
  <h1>Participant area</h1>
  <p>The materials of the first edition are for participants. Enter the first-edition password to continue.</p>
  <form id="gate" novalidate>
    <label for="password">Password</label>
    <div class="field">
      <input id="password" type="password" autocomplete="current-password" required aria-describedby="message">
      <button type="submit">Enter</button>
    </div>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <label class="remember"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
  </form>
  <noscript><p class="message">The participant area needs JavaScript.</p></noscript>
  <a class="home" href="https://codingprovenance.org/">← Coding Provenance Workshop</a>
</main>
<script>
(function () {
  var HASH = '004c2c450394dd181f2674aae998355e379aaa33064dd112eaee085a92a50979';
  var params = new URLSearchParams(location.search);
  var requested = params.get('next') || 'index.html';
  var next = /^[a-z0-9-]+\.html$/.test(requested) ? requested : 'index.html';
  var token = null;
  try { token = sessionStorage.getItem('cp1-access') || localStorage.getItem('cp1-access'); } catch (e) {}
  if (token === HASH) { location.replace(next); return; }

  var form = document.getElementById('gate');
  var input = document.getElementById('password');
  var remember = document.getElementById('remember');
  var button = form.querySelector('button');
  var message = document.getElementById('message');

  function derive(password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits'])
      .then(function (key) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('coding-provenance-2025'), iterations: 310000 }, key, 256);
      })
      .then(function (bits) {
        return Array.prototype.map.call(new Uint8Array(bits), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!input.value) { message.textContent = 'Enter the password.'; input.focus(); return; }
    button.disabled = true; message.textContent = '';
    derive(input.value).then(function (hash) {
      if (hash === HASH) {
        try {
          sessionStorage.setItem('cp1-access', hash);
          if (remember.checked) localStorage.setItem('cp1-access', hash);
        } catch (err) {}
        location.replace(next);
      } else {
        button.disabled = false;
        message.textContent = 'That password is not right. Try again.';
        input.select();
      }
    });
  });
})();
</script>
</body>
</html>
